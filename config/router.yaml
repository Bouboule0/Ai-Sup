router:
  max_retries_before_escalation: 2
  min_remaining_budget_for_planner: 0.25

shell:
  allowed_commands:
    - "pytest"
    - "python"
    - "git status"
    - "git diff"
    - "ruff"
    - "ls"

# Optional Jev decision layer (wired into StepRouter in a later change).
decision:
  enabled: false
  model: "jev"
  escalate_min_probability: 0.7
  retry_max_probability: 0.3
  timeout_s: 10.0
  max_input_chars: 8000
