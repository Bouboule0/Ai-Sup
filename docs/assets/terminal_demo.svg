<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" shape-rendering="crispEdges">
  <defs>
    <style>
      .bg { fill: #18181b; }
      .border { fill: none; stroke: #2e323b; stroke-width: 2; }
      .mono {
        font-family: 'Cascadia Mono', 'Consolas', 'JetBrains Mono', 'SFMono-Regular', 'Courier New', monospace;
        font-size: 14px;
        white-space: pre;
        shape-rendering: auto;
      }
      .title-orange { fill: #d97757; font-weight: bold; }
      .dim { fill: #71717a; }
      .white-txt { fill: #e4e4e7; }

      /* Twinkling stars */
      @keyframes twinkle1 {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0.25; }
      }
      @keyframes twinkle2 {
        0%, 33% { opacity: 0.25; }
        34%, 66% { opacity: 1; }
        67%, 100% { opacity: 0.35; }
      }
      @keyframes cloudDrift {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(10px); }
      }

      .star-a { fill: #e4e4e7; animation: twinkle1 1.8s infinite; }
      .star-b { fill: #a1a1aa; animation: twinkle2 2.5s infinite; }
      .clouds { animation: cloudDrift 7s ease-in-out infinite; }

      /* 4-Phase State Visibility (12s cycle) */
      @keyframes phase1 {
        0%, 23% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      @keyframes phase2 {
        0%, 24% { opacity: 0; }
        26%, 53% { opacity: 1; }
        55%, 100% { opacity: 0; }
      }
      @keyframes phase3 {
        0%, 54% { opacity: 0; }
        56%, 76% { opacity: 1; }
        78%, 100% { opacity: 0; }
      }
      @keyframes phase4 {
        0%, 77% { opacity: 0; }
        79%, 98% { opacity: 1; }
        100% { opacity: 0; }
      }

      .p1 { animation: phase1 12s infinite; }
      .p2 { animation: phase2 12s infinite; }
      .p3 { animation: phase3 12s infinite; }
      .p4 { animation: phase4 12s infinite; }

      /* Mascot Walking and Leg Animation */
      @keyframes walkX {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(130px); }
      }
      @keyframes legA {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes legB {
        0%, 49% { opacity: 0; }
        50%, 100% { opacity: 1; }
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0px); }
        25% { transform: translateX(-4px); }
        75% { transform: translateX(4px); }
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      .walker { animation: walkX 3.2s ease-in-out infinite; }
      .leg-step-a { animation: legA 0.4s steps(1) infinite; }
      .leg-step-b { animation: legB 0.4s steps(1) infinite; }
      .shaker { animation: shake 0.35s infinite; }
      .bouncer { animation: bounce 0.55s ease-in-out infinite; }
    </style>

    <!-- Dither Patterns matching Claude Code's ░ ▒ ▓ shading -->
    <pattern id="dither-cloud" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#27272a"/>
      <rect x="0" y="0" width="2" height="2" fill="#52525b"/>
      <rect x="2" y="2" width="2" height="2" fill="#3f3f46"/>
    </pattern>
    <pattern id="dither-moon-mid" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#71717a"/>
      <rect x="0" y="0" width="2" height="2" fill="#d4d4d8"/>
      <rect x="2" y="2" width="2" height="2" fill="#a1a1aa"/>
    </pattern>
    <pattern id="dither-moon-dark" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#27272a"/>
      <rect x="0" y="0" width="2" height="2" fill="#71717a"/>
      <rect x="2" y="2" width="2" height="2" fill="#52525b"/>
    </pattern>
  </defs>

  <!-- Terminal Window Background -->
  <rect class="bg" x="0" y="0" width="820" height="370" rx="10" />
  <rect class="border" x="1" y="1" width="818" height="368" rx="10" />

  <!-- Top Header (Claude Code style) -->
  <text x="24" y="34" class="mono">
    <tspan class="title-orange">Welcome to Ai-Sup</tspan>
    <tspan class="dim"> v0.1.0 · </tspan>
    <tspan fill="#60a5fa">gemini-4-argon</tspan>
    <tspan class="dim"> (Planner) + </tspan>
    <tspan fill="#d97757">gemini-3.8-flash</tspan>
    <tspan class="dim"> (Executor)</tspan>
  </text>

  <!-- Top Dotted Separator Line -->
  <text x="24" y="56" class="mono dim">··························································································</text>

  <!-- Twinkling Stars (*) -->
  <text x="88" y="92" class="mono star-a">*</text>
  <text x="456" y="106" class="mono star-b">*</text>
  <text x="364" y="152" class="mono star-a">*</text>
  <text x="36" y="182" class="mono star-b">*</text>
  <text x="312" y="232" class="mono star-a">*</text>
  <text x="562" y="220" class="mono star-b">*</text>
  <text x="760" y="202" class="mono star-a">*</text>

  <!-- Pixel-Block Clouds (Exact layout from Claude Code screenshot) -->
  <g class="clouds">
    <!-- Left Cloud -->
    <rect x="180" y="104" width="80" height="16" fill="url(#dither-cloud)" />
    <rect x="76"  y="120" width="40" height="16" fill="url(#dither-cloud)" />
    <rect x="156" y="120" width="130" height="16" fill="url(#dither-cloud)" />
    <rect x="64"  y="136" width="250" height="18" fill="url(#dither-cloud)" />

    <!-- Lower-Right Cloud -->
    <rect x="484" y="168" width="52" height="16" fill="url(#dither-cloud)" />
    <rect x="458" y="184" width="104" height="16" fill="url(#dither-cloud)" />
    <rect x="432" y="200" width="210" height="16" fill="url(#dither-cloud)" />
  </g>

  <!-- Pixel-Block Crescent Moon "C" (Exact pixel grid from Claude Code screenshot) -->
  <g transform="translate(592, 68)">
    <!-- Row 1 -->
    <rect x="26" y="0"  width="65" height="16" fill="#e4e4e7" />
    <rect x="91" y="0"  width="26" height="16" fill="url(#dither-moon-mid)" />
    <rect x="117" y="0" width="13" height="16" fill="url(#dither-moon-dark)" />
    <!-- Row 2 -->
    <rect x="13" y="16" width="26" height="16" fill="#e4e4e7" />
    <rect x="39" y="16" width="26" height="16" fill="url(#dither-moon-dark)" />
    <rect x="130" y="16" width="26" height="16" fill="url(#dither-moon-dark)" />
    <!-- Row 3 -->
    <rect x="0"  y="32" width="39" height="16" fill="#e4e4e7" />
    <rect x="39" y="32" width="13" height="16" fill="url(#dither-moon-mid)" />
    <rect x="52" y="32" width="13" height="16" fill="url(#dither-moon-dark)" />
    <!-- Row 4 -->
    <rect x="0"  y="48" width="39" height="16" fill="#e4e4e7" />
    <rect x="39" y="48" width="13" height="16" fill="url(#dither-moon-mid)" />
    <rect x="52" y="48" width="13" height="16" fill="url(#dither-moon-dark)" />
    <!-- Row 5 -->
    <rect x="13" y="64" width="26" height="16" fill="#e4e4e7" />
    <rect x="39" y="64" width="26" height="16" fill="url(#dither-moon-dark)" />
    <rect x="130" y="64" width="13" height="16" fill="url(#dither-moon-dark)" />
    <rect x="143" y="64" width="13" height="16" fill="#e4e4e7" />
    <!-- Row 6 -->
    <rect x="26" y="80" width="13" height="16" fill="url(#dither-moon-dark)" />
    <rect x="39" y="80" width="26" height="16" fill="url(#dither-moon-mid)" />
    <rect x="65" y="80" width="39" height="16" fill="#e4e4e7" />
    <rect x="104" y="80" width="26" height="16" fill="url(#dither-moon-mid)" />
    <rect x="130" y="80" width="13" height="16" fill="url(#dither-moon-dark)" />
  </g>

  <!-- Ground Dotted Line -->
  <text x="24" y="252" class="mono dim">··························································································</text>

  <!-- ================================================================= -->
  <!-- PARENT PLANNER MASCOT (Left - Blue Architect in Claude Block Style)-->
  <!-- ================================================================= -->
  <g transform="translate(54, 190)">
    <!-- Head top -->
    <rect x="10" y="0" width="80" height="14" fill="#60a5fa" />
    <!-- Middle with side ears & dark square eyes -->
    <rect x="0"  y="14" width="100" height="16" fill="#60a5fa" />
    <rect x="22" y="17" width="10" height="10" fill="#18181b" />
    <rect x="68" y="17" width="10" height="10" fill="#18181b" />
    <!-- Lower torso -->
    <rect x="10" y="30" width="80" height="16" fill="#60a5fa" />
    <!-- 4 Legs standing on ground line (covering dots behind) -->
    <rect x="10" y="46" width="80" height="18" fill="#18181b" />
    <rect x="10" y="46" width="12" height="18" fill="#60a5fa" />
    <rect x="30" y="46" width="12" height="18" fill="#60a5fa" />
    <rect x="58" y="46" width="12" height="18" fill="#60a5fa" />
    <rect x="78" y="46" width="12" height="18" fill="#60a5fa" />
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 1: PLANNING                                                 -->
  <!-- ================================================================= -->
  <g class="p1">
    <text x="58" y="178" class="mono" fill="#93c5fd" font-weight="bold">[Plan...]</text>
    <!-- Authentic Claude Code Mascot (Waiting) -->
    <g transform="translate(195, 190)">
      <rect x="12" y="0"  width="96" height="14" fill="#d97757" />
      <rect x="0"  y="14" width="120" height="16" fill="#d97757" />
      <rect x="26" y="17" width="11" height="11" fill="#18181b" />
      <rect x="83" y="17" width="11" height="11" fill="#18181b" />
      <rect x="12" y="30" width="96" height="16" fill="#d97757" />
      <rect x="12" y="46" width="96" height="18" fill="#18181b" />
      <rect x="12" y="46" width="13" height="18" fill="#d97757" />
      <rect x="34" y="46" width="13" height="18" fill="#d97757" />
      <rect x="73" y="46" width="13" height="18" fill="#d97757" />
      <rect x="95" y="46" width="13" height="18" fill="#d97757" />
    </g>
    <text x="32" y="294" class="mono">
      <tspan fill="#60a5fa">●</tspan>
      <tspan class="white-txt" font-weight="bold"> Argon (Planner)</tspan>
      <tspan fill="#a1a1aa"> designs the atomic execution plan (JSON validated)...</tspan>
    </text>
    <text x="32" y="324" class="mono">
      <tspan class="dim">&gt; 1. </tspan><tspan fill="#60a5fa" font-weight="bold">Phase: Planning ✓</tspan>
      <tspan class="dim">   |   Steps: </tspan><tspan fill="#34d399">█░░░░░░░░░ 1/10</tspan>
      <tspan class="dim">   |   Cost: </tspan><tspan fill="#fbbf24" font-weight="bold">$0.0420 / $1.5000</tspan>
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 2: EXECUTING (Authentic Mascot Walking & Calling Tools)     -->
  <!-- ================================================================= -->
  <g class="p2">
    <g class="walker">
      <g transform="translate(195, 190)">
        <rect x="12" y="0"  width="96" height="14" fill="#d97757" />
        <rect x="0"  y="14" width="120" height="16" fill="#d97757" />
        <rect x="26" y="17" width="11" height="11" fill="#18181b" />
        <rect x="83" y="17" width="11" height="11" fill="#18181b" />
        <rect x="12" y="30" width="96" height="16" fill="#d97757" />
        <rect x="12" y="46" width="96" height="18" fill="#18181b" />
        <!-- Animated 4 legs Pose A -->
        <g class="leg-step-a">
          <rect x="12" y="46" width="13" height="18" fill="#d97757" />
          <rect x="34" y="46" width="13" height="12" fill="#d97757" />
          <rect x="73" y="46" width="13" height="18" fill="#d97757" />
          <rect x="95" y="46" width="13" height="12" fill="#d97757" />
        </g>
        <!-- Animated 4 legs Pose B -->
        <g class="leg-step-b">
          <rect x="12" y="46" width="13" height="12" fill="#d97757" />
          <rect x="34" y="46" width="13" height="18" fill="#d97757" />
          <rect x="73" y="46" width="13" height="12" fill="#d97757" />
          <rect x="95" y="46" width="13" height="18" fill="#d97757" />
        </g>
        <text x="134" y="32" class="mono" fill="#fbbf24" font-weight="bold">⚡ write_file("parser.py") · pytest</text>
      </g>
    </g>
    <text x="32" y="294" class="mono">
      <tspan fill="#d97757">●</tspan>
      <tspan class="white-txt" font-weight="bold"> Flash (Executor)</tspan>
      <tspan fill="#a1a1aa"> runs </tspan>
      <tspan fill="#fbbf24" font-weight="bold">step_3</tspan>
      <tspan fill="#a1a1aa"> in fast ReAct tool loop (Turn 2/4)...</tspan>
    </text>
    <text x="32" y="324" class="mono">
      <tspan class="dim">&gt; 2. </tspan><tspan fill="#fbbf24" font-weight="bold">Phase: ReAct Loop ✓</tspan>
      <tspan class="dim"> |   Steps: </tspan><tspan fill="#34d399">████░░░░░░ 4/10</tspan>
      <tspan class="dim">   |   Cost: </tspan><tspan fill="#fbbf24" font-weight="bold">$0.1840 / $1.5000</tspan>
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 3: ESCALATION (StepRouter Replan)                           -->
  <!-- ================================================================= -->
  <g class="p3">
    <text x="58" y="178" class="mono" fill="#c084fc" font-weight="bold">[Replan!]</text>
    <g class="shaker">
      <g transform="translate(195, 190)">
        <rect x="12" y="0"  width="96" height="14" fill="#ef4444" />
        <rect x="0"  y="14" width="120" height="16" fill="#ef4444" />
        <rect x="26" y="17" width="11" height="11" fill="#18181b" />
        <rect x="83" y="17" width="11" height="11" fill="#18181b" />
        <rect x="12" y="30" width="96" height="16" fill="#ef4444" />
        <rect x="12" y="46" width="96" height="18" fill="#18181b" />
        <rect x="12" y="46" width="13" height="18" fill="#ef4444" />
        <rect x="34" y="46" width="13" height="18" fill="#ef4444" />
        <rect x="73" y="46" width="13" height="18" fill="#ef4444" />
        <rect x="95" y="46" width="13" height="18" fill="#ef4444" />
        <text x="134" y="32" class="mono" fill="#f87171" font-weight="bold">! Retry 2/2 -&gt; Escalate to Argon</text>
      </g>
    </g>
    <text x="32" y="294" class="mono">
      <tspan fill="#c084fc">●</tspan>
      <tspan class="white-txt" font-weight="bold"> StepRouter</tspan>
      <tspan fill="#a1a1aa"> : 2 failures on complex </tspan>
      <tspan fill="#f87171" font-weight="bold">step_4</tspan>
      <tspan fill="#a1a1aa"> → Escalating back to </tspan>
      <tspan fill="#60a5fa" font-weight="bold">Argon</tspan>
      <tspan fill="#a1a1aa">!</tspan>
    </text>
    <text x="32" y="324" class="mono">
      <tspan class="dim">&gt; 3. </tspan><tspan fill="#c084fc" font-weight="bold">Phase: Escalation ✓</tspan>
      <tspan class="dim"> |   Steps: </tspan><tspan fill="#f87171">██████░░░░ 6/10</tspan>
      <tspan class="dim">   |   Cost: </tspan><tspan fill="#fbbf24" font-weight="bold">$0.3120 / $1.5000</tspan>
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- PHASE 4: SUCCESS                                                  -->
  <!-- ================================================================= -->
  <g class="p4">
    <text x="58" y="178" class="mono" fill="#4ade80" font-weight="bold">★ Bravo !</text>
    <g class="bouncer">
      <g transform="translate(225, 190)">
        <rect x="12" y="0"  width="96" height="14" fill="#d97757" />
        <rect x="0"  y="14" width="120" height="16" fill="#d97757" />
        <rect x="26" y="17" width="11" height="11" fill="#18181b" />
        <rect x="83" y="17" width="11" height="11" fill="#18181b" />
        <rect x="12" y="30" width="96" height="16" fill="#d97757" />
        <rect x="12" y="46" width="13" height="18" fill="#d97757" />
        <rect x="34" y="46" width="13" height="18" fill="#d97757" />
        <rect x="73" y="46" width="13" height="18" fill="#d97757" />
        <rect x="95" y="46" width="13" height="18" fill="#d97757" />
        <text x="134" y="32" class="mono" fill="#4ade80" font-weight="bold">✓ 10/10 steps validated! (-58% cost)</text>
      </g>
    </g>
    <text x="32" y="294" class="mono">
      <tspan fill="#4ade80">✓</tspan>
      <tspan fill="#4ade80" font-weight="bold"> Goal completed successfully!</tspan>
      <tspan fill="#a1a1aa"> All pytest checks passed within budget.</tspan>
    </text>
    <text x="32" y="324" class="mono">
      <tspan class="dim">&gt; 4. </tspan><tspan fill="#4ade80" font-weight="bold">Dark mode ✓</tspan>
      <tspan class="dim">         |   Steps: </tspan><tspan fill="#4ade80">██████████ 10/10</tspan>
      <tspan class="dim">  |   Cost: </tspan><tspan fill="#4ade80" font-weight="bold">$0.4950 / $1.5000</tspan>
    </text>
  </g>
</svg>
