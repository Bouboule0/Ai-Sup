[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-sup"
version = "0.1.0"
description = "Minimal Plan-then-Execute orchestrator supporting multi-model AI pairings (Gemini & Claude)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
orch = "orchestrator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
